[project]
name = "kise-backend"
version = "0.1.0"
description = "Kise - personal expense tracker API (Ethiopian & Gregorian calendars)"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "sqlalchemy==2.0.36",
    "alembic==1.14.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",
    "python-multipart==0.0.20",
    "pyjwt==2.10.1",
    "bcrypt==4.2.1",
    "email-validator==2.2.0",
    "psycopg[binary]==3.2.3",
    "jinja2==3.1.5",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "httpx==0.28.1",
    "ruff==0.8.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kise"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Autogenerated by Alembic: the long lines are column definitions written by the tool, not by hand.
# Everything else is still checked.
"migrations/versions/*.py" = ["E501"]
