# Deploy to Heroku from GitHub.
#
# Triggered on every push to main (and manually via "Run workflow"). Tests must pass before the
# deploy job runs, so a red build never reaches production. The push to Heroku's git remote starts
# a normal build; the Procfile's `release` phase runs `alembic upgrade head` before the new web
# dynos take traffic.
#
# Required repository settings (Settings -> Secrets and variables -> Actions):
#   secret   HEROKU_API_KEY    from `heroku authorizations:create` (do NOT use a personal login)
#   variable HEROKU_APP_NAME   the target Heroku app, e.g. kise-api
#
# One-time setup on the Heroku side, because a root package.json makes Heroku detect Node first:
#   heroku buildpacks:set heroku/python --app <app>
name: Deploy to Heroku

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once, and never cancel one midway.
concurrency:
  group: deploy-heroku
  cancel-in-progress: false

jobs:
  test:
    name: Lint & test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check src tests migrations

      - name: Test
        run: python -m pytest -q

  deploy:
    name: Deploy
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://${{ vars.HEROKU_APP_NAME }}.herokuapp.com

    steps:
      # Heroku builds from the pushed history, so the full clone is required.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Heroku
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_APP_NAME: ${{ vars.HEROKU_APP_NAME }}
        run: |
          set -euo pipefail
          test -n "$HEROKU_APP_NAME" || { echo "::error::HEROKU_APP_NAME variable is not set"; exit 1; }
          test -n "$HEROKU_API_KEY" || { echo "::error::HEROKU_API_KEY secret is not set"; exit 1; }
          # The API key travels in the remote URL; git never writes it to disk here and Actions
          # masks the secret in logs.
          git push --force \
            "https://heroku:$HEROKU_API_KEY@git.heroku.com/$HEROKU_APP_NAME.git" \
            "HEAD:refs/heads/main"

      - name: Verify the deployed app answers /health
        env:
          HEROKU_APP_NAME: ${{ vars.HEROKU_APP_NAME }}
        run: |
          set -euo pipefail
          url="https://$HEROKU_APP_NAME.herokuapp.com/health"
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -fsS -o /dev/null -w '%{http_code}' "$url" || true)
            if [ "$code" = "200" ]; then
              echo "healthy: $url returned 200"
              exit 0
            fi
            echo "attempt $attempt: got '${code:-no response}', retrying in 10s"
            sleep 10
          done
          echo "::error::$url did not return 200 after the release finished"
          exit 1
