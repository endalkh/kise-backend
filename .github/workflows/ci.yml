# Lint and test on every push and pull request.
#
# No database service is needed: the suite points KISE_DATABASE_URL at SQLite, and pytest picks up
# `pythonpath = ["src"]` from pyproject.toml, so the package needs no install step.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint & test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check src tests migrations

      - name: Test
        run: python -m pytest -q
